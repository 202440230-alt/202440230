<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SaveSpace</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        header {
            background-color: rgb(255, 244, 235);
            padding: 15px;
        }

        h1 {
            color: rgb(201, 125, 125);
        }

        h2 {
            color: rgb(216, 158, 158);
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            margin-right: 15px;
        }

        main {
            margin-top: 30px;
        }

        form {
            max-width: 400px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            padding: 8px 15px;
        }

        footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid gray;
        }
    </style>
</head>

<body>

    <header>
        <h1>SaveSpace</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="storage_spaces.html">Storage Spaces</a>
            <a href="login.html">Log In</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Create an Account</h2>

            <p>
                Register to start using SaveSpace.
            </p>

            <form>
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname">

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email">

                <label for="contact">Contact Number</label>
                <input type="tel" id="contact" name="contact">

                <label for="password">Password</label>
                <input type="password" id="password" name="password">

                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password">

                <button type="submit">Create Account</button>
            </form>

            <p>
                Already have an account?
                <a href="login.html">Log In</a>
            </p>
        </section>

    </main>

    <footer>
        <p>
            <a href="index.html">Back to Home</a>
        </p>

        <p>
            SaveSpace - Simple temporary storage for people in Palawan.
        </p>
    </footer>

</body>

</html>
